<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Just Drive - A simple yet addictive 2D racing game! Control your car, avoid obstacles, and enjoy the thrill of the drive!">
    <meta name="keywords" content="just drive, racing game, 2D game, car game, browser game, free game, driving game, simple racing">
    <title>Just Drive - Free 2D Racing Game | Simple & Fun!</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_PUBLISHER_ID" crossorigin="anonymous"></script>
</head>
<body>
    <div class="game-container">
        <!-- Top Ad -->
        <div class="ad-container top-ad">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-YOUR_PUBLISHER_ID"
                 data-ad-slot="YOUR_AD_SLOT_ID_1"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>

        <div class="game-header">
            <div class="game-title">Just Drive</div>
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="timer">0</span>s</div>
            <div class="best-score">Best: <span id="best-score">0</span></div>
            <div class="game-controls">
                <button id="pause-button" class="control-button">⏸️</button>
                <button id="music-button" class="control-button">🎵</button>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="gameOver" class="game-over hidden">
            <h2>Game Over!</h2>
            <p>Your Score: <span id="final-score">0</span></p>
            <button id="restart-button">Play Again</button>
        </div>

        <!-- Bottom Ad -->
        <div class="ad-container bottom-ad">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-YOUR_PUBLISHER_ID"
                 data-ad-slot="YOUR_AD_SLOT_ID_2"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>
    </div>
    <audio id="background-music" loop>
        <source src="music/Feel-Good(chosic.com).mp3" type="audio/mpeg">
    </audio>
    <script src="game.js"></script>
    <script>
        // Initialize AdSense ads
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</body>
</html>
